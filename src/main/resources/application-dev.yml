logging:
  pattern:
    console: "%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}){} %clr(${PID:-}){magenta} %clr(--- %esb(){APPLICATION_NAME}%esb{APPLICATION_GROUP}[%15.15t] ${LOG_CORRELATION_PATTERN:-}){faint}%clr(%-40.40logger{39}){cyan} %clr(:){faint} %replace(%replace(%m<KVP>%kvp{NONE}){'<KVP>$',''}){'<KVP>','\n    '}%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
  observations:
    key-values:
      application: ${spring.application.name}
      environment: dev
