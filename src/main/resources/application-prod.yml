logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: prod
  include-application-name: false
  pattern:
    correlation: '[%X{traceId:-},%X{spanId:-},%X{reqId:-}] '

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  observations:
    key-values:
      application: ${spring.application.name}
      environment: prod
  tracing:
    sampling:
      probability: 0.1
