server:
  port: 18080
  servlet:
    context-path: /
spring:
  application:
    name: springboot-template-jwt-api
  # 默认使用 H2 作为兜底数据源；若存在外部数据库配置（环境变量、命令行或 ./config/application.yml），会优先生效并覆盖此处
  datasource:
    driver-class-name: org.h2.Driver
    url: 'jdbc:h2:file:./db/demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE'
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/*.sql
      encoding: UTF-8
      continue-on-error: true
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  profiles:
    active: knife4j,satoken
  web:
    verify:
      mail-limit: 60
    flow:
      limit: 50
      period: 3
      block: 30
    cors:
      origin: '*'
      credentials: false
      methods: '*'
  data:
    redis:
      host: xxx
      port: 6379
      database: 0
      password:
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms


# jimmer配置参考 https://babyfish-ct.github.io/jimmer-doc/zh/docs/spring/appendix
jimmer:
  # Kotlin项目必须配置 默认java
  language: kotlin
  # Jimmer方言类名
  #  dialect: org.babyfish.jimmer.sql.dialect.PostgresDialect
  dialect: org.babyfish.jimmer.sql.dialect.H2Dialect
  # 是否打印SQL日志 默认false
  show-sql: true
  # 是否格式化SQL日志 默认false
  pretty-sql: true
  # 如果非NONE，验证数据库结构和代码实体类型结构的一致性，如果不一致，WARNING导致日志告警，ERROR导致报错
  # 本地(H2)放宽校验，外部真实数据库可在外部配置中覆盖为 ERROR
  database-validation-mode: NONE
